<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <title>Meine Seiten</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .button-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }

        .category {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .category-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .link-button {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 500;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .link-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .link-button:active {
            transform: translateY(0);
        }

        .link-button:last-child {
            margin-bottom: 0;
        }

        .series-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.3);
        }

        .series-button:hover {
            box-shadow: 0 6px 20px rgba(240, 147, 251, 0.4);
        }

        .movies-button {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }

        .movies-button:hover {
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
        }

        .icon {
            font-size: 1.5em;
        }

        .install-prompt {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: none;
            margin-bottom: 20px;
        }

        .install-prompt.show {
            display: block;
        }

        .install-button {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.3);
        }

        .install-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.4);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5em;
            }

            .link-button {
                font-size: 1em;
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Meine Seiten</h1>

        <div id="installPrompt" class="install-prompt">
            <p style="margin-bottom: 10px; color: #333; font-weight: 600;">📱 App installieren</p>
            <p style="margin-bottom: 10px; color: #666; font-size: 0.9em;">Installiere diese Seite als App auf deinem Startbildschirm!</p>
            <button id="installButton" class="install-button">Jetzt installieren</button>
        </div>

        <div class="button-grid">
            <!-- BurningSeries Kategorie -->
            <div class="category">
                <div class="category-title">
                    <span class="icon">📺</span>
                    <span>BurningSeries</span>
                </div>
                <a href="https://burning-series.io" class="link-button series-button" target="_blank" rel="noopener noreferrer">
                    BurningSeries (Serien)
                </a>
                <a href="https://burning-series.io/serie/Dexter" class="link-button series-button" target="_blank" rel="noopener noreferrer">
                    Dexter
                </a>
                <a href="https://burning-series.io/serie/Bluey" class="link-button series-button" target="_blank" rel="noopener noreferrer">
                    Bluey
                </a>
                <a href="https://burning-series.io/serie/Fallout-2024" class="link-button series-button" target="_blank" rel="noopener noreferrer">
                    Fallout
                </a>
                <a href="https://burning-series.io/serie/From" class="link-button series-button" target="_blank" rel="noopener noreferrer">
                    From
                </a>
            </div>

            <!-- Filme Kategorie -->
            <div class="category">
                <div class="category-title">
                    <span class="icon">🎥</span>
                    <span>Filme</span>
                </div>
                <a href="https://cine-to.com" class="link-button movies-button" target="_blank" rel="noopener noreferrer">
                    CineTo (Filme)
                </a>
                <a href="https://kinoger.com" class="link-button movies-button" target="_blank" rel="noopener noreferrer">
                    KinoGer (Filme & Serien)
                </a>
            </div>
        </div>
    </div>

    <script>
        // Service Worker registrieren
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => console.log('Service Worker registriert'))
                    .catch(error => console.log('Service Worker Fehler:', error));
            });
        }

        // PWA Installation
        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');
        const installButton = document.getElementById('installButton');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installPrompt.classList.add('show');
        });

        installButton.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`Installation: ${outcome}`);
                deferredPrompt = null;
                installPrompt.classList.remove('show');
            }
        });

        window.addEventListener('appinstalled', () => {
            console.log('PWA wurde installiert');
            installPrompt.classList.remove('show');
        });
    </script>
</body>
</html>
